<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Настройка аккордеона</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="viewport">
    <div class="stage" id="stage">

      <!-- Шапка конструктора -->
      <header class="ctor-header">
        <div class="ctor-header__left">
          <div class="pill-group">
            <button class="tb-btn tb-btn--text" type="button" id="menuBtn"><span class="ico">&#xEBBE;</span><span class="tb-btn__label">Меню</span></button>
            <button class="tb-btn tb-btn--text" type="button" id="logoBtn"><span class="ico">&#xE9E2;</span><span class="tb-btn__label">Логотип</span></button>
          </div>
        </div>

        <div class="ctor-header__center">
          <div class="ctor-header__colors">
            <button class="pill-group theme-btn" type="button">
              <span class="theme-btn__label">Тема</span>
              <span class="swatches">
                <span class="swatch" style="--c:#2c3e50"></span>
                <span class="swatch" style="--c:#0c94ff"></span>
                <span class="swatch" style="--c:#cc3d00"></span>
              </span>
            </button>
            <button class="pill-group theme-btn" type="button">
              <span class="theme-btn__label">Фон</span>
              <span class="swatches"><span class="swatch" style="--c:#f8f8f8"></span></span>
            </button>
          </div>

          <div class="ctor-header__tools">
            <div class="pill-group">
              <button class="tb-btn" type="button"><span class="ico">&#xE6C0;</span></button>
              <button class="tb-btn" type="button"><span class="ico">&#xE6BF;</span></button>
              <button class="tb-btn is-active" type="button"><span class="ico">&#xE6C2;</span></button>
            </div>
            <div class="pill-group pill-group--r12">
              <button class="tb-btn is-active" type="button"><span class="ico">&#xE730;</span></button>
              <button class="tb-btn" type="button"><span class="ico">&#xE637;</span></button>
              <button class="tb-btn" type="button"><span class="ico">&#xEAB4;</span></button>
            </div>
            <div class="pill-group pill-group--r12">
              <button class="tb-btn" type="button"><span class="ico">&#xE6CF;</span></button>
              <button class="tb-btn" type="button"><span class="ico">&#xE6CA;</span></button>
              <button class="tb-btn" type="button"><span class="ico">&#xE629;</span></button>
              <button class="tb-btn tb-btn--zoom" type="button">100%</button>
            </div>
          </div>
        </div>

        <div class="ctor-header__right">
          <button class="pill-group lang-btn" type="button">Язык RU</button>
          <button class="done-btn" type="button" aria-label="Сохранить"><span class="ico ico--20">&#xE75E;</span></button>
          <button class="close-btn" type="button" aria-label="Закрыть"><img src="assets/img/close-header.svg" width="28" height="28" alt=""></button>
        </div>
      </header>

      <!-- Аккордеон -->
      <nav class="accordion" id="accordion" aria-label="Навигация приложения">
        <div class="acc-header">
          <div class="acc-header__row">
            <button class="acc-bird" type="button" aria-label="Логотип"><span class="ico24">&#xE9E2;</span></button>
            <button class="acc-logo" type="button" id="goHome">saby</button>
            <button class="acc-plus" type="button" aria-label="Добавить раздел"><span class="ico">&#xEB25;</span></button>
          </div>
          <div class="acc-group">
            <button class="acc-burger" type="button" aria-label="Свернуть"><span class="acc-icon16">&#xE91F;</span></button>
            <span class="acc-group__title">предприятие</span>
          </div>
        </div>
        <ul class="acc-list" id="accList"></ul>
      </nav>

      <!-- Контент: пока скриншоты -->
      <main class="content">
        <img class="content__shot" id="contentShot" src="assets/img/page-main.png" alt="">
      </main>

      <!-- Правая панель -->
      <aside class="right-panel">
        <div class="right-panel__cmds">
          <button class="rp-btn rp-btn--accent" type="button" aria-label="Магазин"><span class="ico24">&#xEADD;</span></button>
          <button class="rp-btn" type="button" aria-label="Данные"><span class="ico ico--24">&#xEBBC;</span></button>
          <button class="rp-btn" type="button" aria-label="Слои"><span class="ico ico--24">&#xEBF9;</span></button>
          <button class="rp-btn" type="button" aria-label="Фильтр"><span class="ico24">&#xE94C;</span></button>
          <button class="rp-btn" type="button" aria-label="Поиск"><span class="ico24">&#xEAA7;</span></button>
          <button class="rp-btn" type="button" aria-label="Настройки"><span class="ico24">&#xEAA9;</span></button>
        </div>
        <button class="rp-more" type="button" aria-label="Ещё"><span class="ico ico--20">&#xE9D9;</span></button>
        <div class="right-panel__spacer"></div>
        <button class="rp-help" type="button" aria-label="Помощь"><img src="assets/img/help.svg" width="12" height="16" alt=""></button>
      </aside>

      <!-- Слой для подменю -->
      <div class="submenu-layer" id="submenuLayer"></div>

      <!-- Окно настроек «Меню» -->
      <section class="set-win" id="menuWin" hidden aria-label="Меню">
        <div class="set-win__head">
          <span class="set-win__title">Меню</span>
          <div class="set-win__cmds">
            <button class="sw-reset" type="button" id="mwReset" aria-label="Сбросить настройки" disabled><span class="ico24">&#xE629;</span></button>
            <button class="sw-done" type="button" id="mwDone" aria-label="Сохранить и закрыть"><span class="ico">&#xE75E;</span></button>
            <button class="sw-close" type="button" id="mwClose" aria-label="Закрыть"><span class="ico24">&#xE66C;</span></button>
          </div>
        </div>
        <div class="set-win__body">
          <div class="mw-tiles">
            <button class="mw-tile mw-tile--wide" type="button" data-view="wide" aria-label="Раскрытый аккордеон">
              <span class="mw-tile__in">
                <span class="mw-tile__acc"><span class="mw-tile__row"><i></i><b></b></span><span class="mw-tile__row is-mid"><i></i><b></b></span><span class="mw-tile__row"><i></i><b></b></span></span>
                <span class="mw-tile__page"><span class="mw-tile__title"><b></b></span><span class="mw-tile__sheet"></span></span>
              </span>
            </button>
            <button class="mw-tile mw-tile--narrow" type="button" data-view="narrow" aria-label="Узкий аккордеон">
              <span class="mw-tile__in">
                <span class="mw-tile__acc"><span class="mw-tile__row"><i></i><b></b></span><span class="mw-tile__row is-mid"><i></i><b></b></span><span class="mw-tile__row"><i></i><b></b></span></span>
                <span class="mw-tile__page"><span class="mw-tile__title"><b></b></span><span class="mw-tile__sheet"><b></b><b></b></span></span>
              </span>
            </button>
          </div>
          <div class="mw-prop" id="mwNarrowRow">
            <span class="mw-prop__name">Вид панели</span>
            <button class="mw-link" type="button" id="mwNarrowLink"></button>
          </div>
          <div class="mw-prop">
            <span class="mw-prop__name">Открывать подменю</span>
            <div class="mw-radios" id="mwTrigger">
              <button class="mw-radio" type="button" data-trigger="hover"><span class="mw-radio__box"></span><span class="mw-radio__text">По наведению</span></button>
              <button class="mw-radio" type="button" data-trigger="click"><span class="mw-radio__box"></span><span class="mw-radio__text">По клику</span></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Выпадающий список «Вид панели» -->
      <div class="mw-menu" id="mwMenu" hidden>
        <div class="mw-menu__list" id="mwMenuList"></div>
        <button class="mw-menu__close" type="button" id="mwMenuClose" aria-label="Закрыть"><img src="assets/img/close-menu.svg" width="12" height="12" alt=""></button>
      </div>

      <!-- Окно настроек «Логотип» -->
      <section class="set-win" id="logoWin" hidden aria-label="Логотип">
        <div class="set-win__head">
          <span class="set-win__title">Логотип</span>
          <div class="set-win__cmds">
            <button class="sw-reset" type="button" id="lwReset" aria-label="Сбросить настройки" disabled><span class="ico24">&#xE629;</span></button>
            <button class="sw-done" type="button" aria-label="Сохранить и закрыть"><span class="ico">&#xE75E;</span></button>
            <button class="sw-close" type="button" aria-label="Закрыть"><span class="ico24">&#xE66C;</span></button>
          </div>
        </div>
        <div class="lw-blocks">
          <div class="set-win__body">
            <p class="lw-hint"><span class="lw-link">Выберите</span> логотип из коллекции или <span class="lw-link">сделайте текстовый логотип</span></p>
            <div class="lw-preview">
              <button class="lw-bird" type="button" id="lwBird" aria-label="Загрузить иконку">
                <span class="lw-bird__logo"></span>
                <span class="lw-bird__clip ico">&#xE671;</span>
              </button>
              <span class="lw-preview__text">saby</span>
            </div>
          </div>
          <div class="lw-actions">
            <div class="lw-actions__head">
              <span class="lw-actions__title">Действия по плюсу</span>
              <span class="lw-round"><span class="ico">&#xEADD;</span></span>
              <span class="lw-round"><span class="ico">&#xE668;</span></span>
            </div>
            <ul class="lw-actions__list">
              <li class="lw-action">
                <span class="lw-action__icon"><span class="ico">&#xE95D;</span></span><span class="lw-action__text">Создать задачу</span>
                <span class="lw-action__cmds"><span class="ico24">&#xEAA9;</span><span class="ico lw-action__del">&#xE65C;</span><span class="ico24">&#xE9D9;</span></span>
              </li>
              <li class="lw-action">
                <span class="lw-action__icon"><span class="ico">&#xE654;</span></span><span class="lw-action__text">Совещание</span>
                <span class="lw-action__cmds"><span class="ico24">&#xEAA9;</span><span class="ico lw-action__del">&#xE65C;</span><span class="ico24">&#xE9D9;</span></span>
              </li>
              <li class="lw-action">
                <span class="lw-action__icon"><span class="ico">&#xEA38;</span></span><span class="lw-action__text">Авансовый отчет</span>
                <span class="lw-action__cmds"><span class="ico24">&#xEAA9;</span><span class="ico lw-action__del">&#xE65C;</span><span class="ico24">&#xE9D9;</span></span>
              </li>
              <li class="lw-action">
                <span class="lw-action__icon"><span class="ico">&#xEB33;</span></span><span class="lw-action__text">Новость</span>
                <span class="lw-action__cmds"><span class="ico24">&#xEAA9;</span><span class="ico lw-action__del">&#xE65C;</span><span class="ico24">&#xE9D9;</span></span>
              </li>
              <li class="lw-action">
                <span class="lw-action__icon"><span class="ico">&#xE671;</span></span><span class="lw-action__text">Загрузить</span>
                <span class="lw-action__cmds"><span class="ico24">&#xEAA9;</span><span class="ico lw-action__del">&#xE65C;</span><span class="ico24">&#xE9D9;</span></span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <!-- Меню «Иконка» (загрузка логотипа) -->
      <div class="icon-menu" id="iconMenu" hidden>
        <div class="icon-menu__head">
          <span class="ico24 icon-menu__head-icon">&#xE671;</span>
          <span class="icon-menu__title">иконка</span>
          <button class="icon-menu__close" type="button" id="iconMenuClose" aria-label="Закрыть"><img src="assets/img/close-popup.svg" width="28" height="28" alt=""></button>
        </div>
        <div class="icon-menu__list">
          <button class="icon-menu__item" type="button"><span class="ico24">&#xE730;</span><span class="icon-menu__text">С компьютера</span></button>
          <button class="icon-menu__item" type="button"><span class="ico24">&#xE90A;</span><span class="icon-menu__text">Из коллекции</span></button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
